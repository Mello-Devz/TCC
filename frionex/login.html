<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar · Frionex</title>
  <meta name="description" content="Acesse sua conta Frionex para acompanhar pedidos, favoritos e comprar peças e equipamentos de climatização.">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <div id="site-header"></div>

  <main class="page-shell">
    <div class="container">
      <div class="auth-page auth-page-solo">
        <div class="auth-main">
          <div class="auth-card">
            <h1>Entrar</h1>
            <p>Use seu e-mail e senha para acessar a Frionex.</p>

            <form class="auth-form" id="loginForm" autocomplete="on">
              <div class="field">
                <label for="loginEmail">E-mail</label>
                <div class="input-wrap">
                  <span class="icon-slot" data-icon="mail"></span>
                  <input id="loginEmail" name="email" type="email" placeholder="seu@email.com" autocomplete="email" required>
                </div>
              </div>
              <div class="field">
                <label for="loginSenha">Senha</label>
                <div class="input-wrap">
                  <span class="icon-slot" data-icon="lock"></span>
                  <input id="loginSenha" name="senha" type="password" placeholder="••••••••" autocomplete="current-password" required>
                  <button class="icon-btn toggle-pass" type="button" data-toggle-pass="loginSenha" aria-label="Mostrar senha">
                    <span class="icon-slot" data-icon="eye"></span>
                  </button>
                </div>
              </div>

              <div class="auth-row">
                <label><input type="checkbox" name="lembrar" checked> Manter conectado</label>
                <a href="#" data-forgot>Esqueci minha senha</a>
              </div>

              <button class="btn btn-grad btn-block auth-submit" type="submit">
                <span class="icon-slot" data-icon="user"></span> Entrar na minha conta
              </button>
            </form>

            <div class="auth-divider">ou use uma conta demo</div>

            <div class="auth-demo">
              <strong>Protótipo · credenciais de teste</strong>
              <span>Comprador: comprador@frionex.com · senha 12345678</span>
              <span>Vendedor: vendedor@frionex.com · senha 12345678</span>
              <div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:4px">
                <button class="btn btn-soft btn-sm" type="button" data-demo="comprador">Preencher comprador</button>
                <button class="btn btn-soft btn-sm" type="button" data-demo="vendedor">Preencher vendedor</button>
              </div>
            </div>

            <p class="auth-alt">Ainda não tem conta? <a href="cadastro.html">Criar conta grátis</a></p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/regiao.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/pages/auth.js"></script>
</body>
</html>
